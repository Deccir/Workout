<!DOCTYPE html>
<html lang="en">

<head>
  <base href=".">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="#">

  <title>Workout Shuffle - Create new Workout</title>
  <link rel="stylesheet" href="createWorkoutTemplate.css">
  <script src="../../lib/js-multiselect-dropdown-main/multi-select-dropdown.js"></script>
  <script src="../../lib/toaster/toaster.js"></script>
  <script src="../../lib/accordion/accordion.js"></script>
  <script src="../../navigation.js"></script>
  <script src="../../loader.js"></script>
  <script src="createWorkoutTemplate.js"></script>
</head>

<body class="dark-theme">
  <div id="toaster-container" class="toaster-container"></div>
  <div id="container" class="exercise-container"></div>

  <button onclick="openDialog('exercise-template-dialog')">Add Exercise</button>
  <button onclick="openDialog('save-dialog')">Save Workout</button>

  <dialog id="exercise-template-dialog">
    <div class="form-field">
      <select multiple search='true' id="muscle-select"></select>
    </div>

    <div class="form-field">
      <select multiple search='true' id="type-select"></select>
    </div>

    <!-- ToDo: Maybe a small info button with example exercises for each difficulty -->
    <div class="form-field">
      <label for="min-difficulty">Please enter the minimum difficulty (0 is easy, 8 is extremely hard):</label>
      <input type="number" id="min-difficulty" class="form-input" min="0" value="0" defaultvalue="0">
    </div>

    <div class="form-field">
      <label for="max-difficulty">Please enter the maximum difficulty (0 is easy, 8 is extremely hard):</label>
      <input type="number" id="max-difficulty" class="form-input" min="0" value="8" defaultvalue="8">
    </div>

    <div><span id="matching-exercises">0</span> Exercises are matching your configuration.</div>

    <div class="form-field">
      <label for="max-difficulty">Use Optional Parameters</label>
      <input type="checkbox" id="use-optional-exercise-param" onclick="toggleAccordion('optional-exercise-inputs')">

      <div class="accordion" id="optional-exercise-inputs">
        <div class="content">
          <div class="form-field">
            <label for="overwrite-exercise-time-input">overwrite how long this exercise should be performed for (in
              seconds):</label>
            <input type="number" id="overwrite-exercise-time-input" class="form-input" min="10" value="40"
              defaultvalue="40">
          </div>

          <div class="form-field">
            <label for="overwrite-set-count-input">overwrite how many sets of this exercise should be done:</label>
            <input type="number" id="overwrite-set-count-input" class="form-input" min="1" value="1" defaultvalue="1"
              onchange="setOverwriteCountUpdated(event)">
          </div>

          <div class="form-field disabled" id="set-rest-time-field">
            <label for="overwrite-set-rest-time-input">overwrite how long to rest between sets (in seconds):</label>
            <input type="number" id="overwrite-set-rest-time-input" class="form-input" min="1" value="120"
              defaultvalue="120" disabled>
          </div>
        </div>
      </div>
    </div>

    <button onclick="closeDialog('exercise-template-dialog')">Cancel</button>
    <button onclick="confirmExerciseRowInput()" id="confirm-exercise-button" disabled="true">OK</button>
  </dialog>

  <dialog id="save-dialog">
    <div class="form-field">
      <label for="name-input">optional name for this Workout:</label>
      <input type="text" id="name-input" class="form-input">
    </div>

    <div class="form-field">
      <label for="exercise-time-input">how long should each exercise be performed for (in seconds):</label>
      <input type="number" id="exercise-time-input" class="form-input" min="10" value="40" defaultvalue="40">
    </div>

    <div class="form-field">
      <label for="rest-time-input">how long to rest between exercises (in seconds):</label>
      <input type="number" id="rest-time-input" class="form-input" min="1" value="90" defaultvalue="90">
    </div>

    <div class="form-field">
      <label for="circuit-count-input">how many times should you go through the entire workout:</label>
      <input type="number" id="circuit-count-input" class="form-input" min="1" value="1" defaultvalue="1">
    </div>

    <div class="form-field">
      <label for="set-count-input">how many sets of each exercise should be done:</label>
      <input type="number" id="set-count-input" class="form-input" min="1" value="1" defaultvalue="1"
        onchange="setCountUpdated(event)">
    </div>

    <div class="form-field disabled" id="set-rest-time-field">
      <label for="set-rest-time-input">how long to rest between sets (in seconds):</label>
      <input type="number" id="set-rest-time-input" class="form-input" min="1" value="120" defaultvalue="120" disabled>
    </div>

    <button onclick="closeDialog('save-dialog')">Cancel</button>
    <button onclick="saveWorkout()" id="save-workout-button" disabled="true">OK</button>
  </dialog>
</body>

</html>
