<!DOCTYPE html>
<html lang="en">

<head>
  <base href=".">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="#">

  <title>Workout Shuffle - Create Workout Template</title>
  <link rel="stylesheet" href="createWorkoutTemplate.css">
  <link rel="stylesheet" href="../../lib/toaster/toaster.css">
  <script src="../../lib/js-multiselect-dropdown-main/multi-select-dropdown.js"></script>
  <script src="../../lib/toaster/toaster.js"></script>
  <script src="../../lib/accordion/accordion.js"></script>
  <script src="../../navigation.js"></script>
  <script src="../../loader.js"></script>
  <script src="createWorkoutTemplate.js"></script>
</head>

<body class="dark-theme">
  <div id="toaster-container" class="toaster-container"></div>

  <header class="page-header">
    <button class="back-link" onclick="showPage(PAGES.Home)" aria-label="Back to menu">←</button>
    <h1>Create Workout Template</h1>
  </header>

  <div id="exercise-list" class="exercise-container"></div>

  <button type="button" class="add-slot" onclick="openDialog('exercise-template-dialog')">+ Add Exercise</button>

  <div class="action-bar">
    <button onclick="openDialog('save-dialog')">Save Template</button>
  </div>

  <dialog id="exercise-template-dialog">
    <h2>Add exercise</h2>
    <div class="form-field">
      <label for="muscle-select">Muscle groups</label>
      <select multiple search='true' id="muscle-select" placeholder="Muscle group"></select>
    </div>

    <div class="form-field">
      <label for="type-select">Exercise types</label>
      <select multiple search='true' id="type-select" placeholder="Exercise Type"></select>
    </div>

    <!-- ToDo: Maybe a small info button with example exercises for each difficulty -->
    <p class="hint">Difficulty ranges from 0 (easy) to 8 (extremely hard).</p>
    <div class="field-row">
      <div class="form-field">
        <label for="min-difficulty">Min difficulty</label>
        <input type="number" id="min-difficulty" class="form-input" min="0" value="0" defaultvalue="0">
      </div>

      <div class="form-field">
        <label for="max-difficulty">Max difficulty</label>
        <input type="number" id="max-difficulty" class="form-input" min="0" value="8" defaultvalue="8">
      </div>
    </div>

    <p class="match-count"><span id="matching-exercises">0</span> exercises match your configuration.</p>

    <div class="form-field">
      <label for="use-optional-exercise-param">Use Optional Parameters</label>
      <input type="checkbox" id="use-optional-exercise-param" onclick="toggleAccordion('optional-exercise-inputs')">

      <div class="accordion" id="optional-exercise-inputs">
        <div class="content">
          <p class="hint">Enable a parameter to override the workout-level value for this exercise.</p>

          <div class="form-field disabled" id="overwrite-exercise-time-field">
            <label class="overwrite-toggle">
              <input type="checkbox" id="overwrite-exercise-time-enabled"
                onclick="toggleOverwriteField('overwrite-exercise-time')">
              Overwrite exercise time (in seconds)
            </label>
            <input type="number" id="overwrite-exercise-time-input" class="form-input" min="10" value="40"
              defaultvalue="40" disabled>
          </div>

          <div class="form-field disabled" id="overwrite-rest-time-field">
            <label class="overwrite-toggle">
              <input type="checkbox" id="overwrite-rest-time-enabled"
                onclick="toggleOverwriteField('overwrite-rest-time')">
              Overwrite rest time between exercises (in seconds)
            </label>
            <input type="number" id="overwrite-rest-time-input" class="form-input" min="1" value="180"
              defaultvalue="180" disabled>
          </div>

          <div class="form-field disabled" id="overwrite-set-count-field">
            <label class="overwrite-toggle">
              <input type="checkbox" id="overwrite-set-count-enabled"
                onclick="toggleOverwriteField('overwrite-set-count')">
              Overwrite number of sets
            </label>
            <input type="number" id="overwrite-set-count-input" class="form-input" min="1" value="1"
              defaultvalue="1" disabled>
          </div>

          <div class="form-field disabled" id="overwrite-set-rest-time-field">
            <label class="overwrite-toggle">
              <input type="checkbox" id="overwrite-set-rest-time-enabled"
                onclick="toggleOverwriteField('overwrite-set-rest-time')">
              Overwrite rest time between sets (in seconds)
            </label>
            <input type="number" id="overwrite-set-rest-time-input" class="form-input" min="1" value="120"
              defaultvalue="120" disabled>
          </div>
        </div>
      </div>
    </div>

    <div class="dialog-actions">
      <button onclick="closeDialog('exercise-template-dialog')">Cancel</button>
      <button onclick="confirmExerciseRowInput()" id="confirm-exercise-button" disabled="true">Add</button>
    </div>
  </dialog>

  <dialog id="save-dialog">
    <h2>Template settings</h2>
    <div class="form-field">
      <label for="name-input">optional name for this template:</label>
      <input type="text" id="name-input" class="form-input">
    </div>

    <div class="form-field">
      <label for="exercise-time-input">how long should each exercise be performed for (in seconds):</label>
      <input type="number" id="exercise-time-input" class="form-input" min="10" value="40" defaultvalue="40">
    </div>

    <div class="form-field">
      <label for="rest-time-input">how long to rest between exercises (in seconds):</label>
      <input type="number" id="rest-time-input" class="form-input" min="1" value="180" defaultvalue="180">
    </div>

    <div class="form-field">
      <label for="circuit-count-input">how many times should you go through the entire workout:</label>
      <input type="number" id="circuit-count-input" class="form-input" min="1" value="1" defaultvalue="1">
    </div>

    <div class="form-field">
      <label for="set-count-input">how many sets of each exercise should be done:</label>
      <input type="number" id="set-count-input" class="form-input" min="1" value="1" defaultvalue="1"
        onchange="onSetCountChanged(event)">
    </div>

    <div class="form-field disabled" id="set-rest-time-field">
      <label for="set-rest-time-input">how long to rest between sets (in seconds):</label>
      <input type="number" id="set-rest-time-input" class="form-input" min="1" value="120" defaultvalue="120" disabled>
    </div>

    <div class="dialog-actions">
      <button onclick="closeDialog('save-dialog')">Cancel</button>
      <button onclick="saveWorkout()" id="save-workout-button" disabled="true">Save</button>
    </div>
  </dialog>
</body>

</html>
