<!DOCTYPE html>
<html lang="en">

<head>
  <base href=".">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="#">

  <title>Deccirs Workout Shuffle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lib/toaster/toaster.css">
  <script src="main.js"></script>
  <script src="loader.js"></script>
  <script src="navigation.js"></script>
  <script src="lib/toaster/toaster.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then((registration) => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
    }
  </script>
</head>

<body class="dark-theme">
  <div id="toaster-container" class="toaster-container"></div>
  <div id="start-menu">
    <h1>Workout Shuffle</h1>
    <button onclick="startWorkout()">Select Workout</button>
    <button onclick="createWorkoutTemplate()">Create Workout</button>
  </div>

  <dialog id="select-workout-dialog">
    <h2>Select a Workout</h2>
    <div id="workout-list"></div>
    <button onclick="closeDialog('select-workout-dialog')">Cancel</button>
  </dialog>

</body>

</html>
