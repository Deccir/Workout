<!DOCTYPE html>
<html lang="en">

<head>
  <base href=".">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="#">

  <title>Deccirs Workout Shuffle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lib/toaster/toaster.css">
  <script src="main.js"></script>
  <script src="loader.js"></script>
  <script src="navigation.js"></script>
  <script src="lib/toaster/toaster.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then((registration) => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
    }
  </script>
</head>

<body class="dark-theme">
  <div id="toaster-container" class="toaster-container"></div>
  <div id="start-menu">
    <div class="brand">
      <div class="brand-mark"><img width="50" src="assets/icon.png"></div>
      <h1>Workout Shuffle</h1>
      <p class="tagline">Randomized workouts, or not.</p>
      <p class="tagline">Your choice.</p>
    </div>
    <button onclick="openTemplatesDialog()">My Workout Templates</button>
    <button onclick="openWorkoutsDialog()">Saved Workouts</button>
    <button class="secondary" onclick="showPage(PAGES.CreateWorkoutTemplate)">Create new Workout Template</button>
    <button class="secondary" onclick="showPage(PAGES.WorkoutEditor)">Manually create Workout</button>
    <button onclick="openDialog('info-dialog')">Info</button>
  </div>

  <dialog id="templates-dialog">
    <h2>My Workout Templates</h2>
    <div id="templates-list"></div>
    <div class="dialog-actions">
      <button onclick="closeDialog('templates-dialog')">Cancel</button>
    </div>
  </dialog>

  <dialog id="workouts-dialog">
    <h2>Saved Workouts</h2>
    <div id="workouts-list"></div>
    <div class="dialog-actions">
      <button onclick="closeDialog('workouts-dialog')">Cancel</button>
    </div>
  </dialog>

  <dialog id="confirm-delete-dialog">
    <h2>Delete</h2>
    <p id="confirm-delete-message"></p>
    <div class="dialog-actions">
      <button onclick="closeDialog('confirm-delete-dialog')">Cancel</button>
      <button class="delete-confirm" id="confirm-delete-button">Delete</button>
    </div>
  </dialog>

  <dialog id="info-dialog">
    <h2>Info</h2>
    <p class="credits-lead">Workout Shuffle</p>
    <p>Author: <strong>Deccir</strong></p>
    <ul class="credits-links">
      <li><a href="https://www.youtube.com/@deccir" target="_blank" rel="noopener">YouTube</a></li>
      <li><a href="https://deccir.itch.io/" target="_blank" rel="noopener">itch.io</a></li>
      <li><a href="https://soundcloud.com/deccir" target="_blank" rel="noopener">SoundCloud</a></li>
    </ul>
    <div class="dialog-actions">
      <button onclick="closeDialog('info-dialog')">Close</button>
    </div>
  </dialog>

</body>

</html>
